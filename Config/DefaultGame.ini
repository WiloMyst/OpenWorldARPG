; TurboLink gRPC 配置：AvatarService 指向 VHServer
; 端口必须与 VHServer/config.yaml 中 server.port 一致
; 注意：必须直连 WSL2 IP，不能用 127.0.0.1
; 原因：gRPC C++ 把 0.0.0.0:50051 绑成 IPv6 双栈 [::]:50051，
; WSL2 的 localhost 转发只覆盖纯 IPv4 127.0.0.1 绑定，不覆盖 IPv6 双栈
; WSL2 重启后 IP 可能漂移，需用 `wsl -d Ubuntu -- hostname -I` 确认新 IP
[/Script/TurboLinkGrpc.TurboLinkGrpcConfig]
