server:
  host: "0.0.0.0"
  port: 50051
  worker_threads: 4
  max_queue_size: 1000

# 对话票据验证密钥 (数据面): 须与 GameServer config.yaml 的 auth.dialogue_secret 完全一致
# VHServer 本地验证签名与有效期, 不回调 GameServer; 为空则放行所有请求 (离线调试模式)
# 生产环境优先用环境变量 DIALOGUE_SECRET 注入并删除此行
auth:
  dialogue_secret: "dev-dialogue-secret-2026"

# 控制面管理端口 (GameServer -> VHServer 服务间 RPC): 踢人/登出联动吊销对话流.
# 数据面票据只在流建立时校验, 已建流的终止须由 GameServer 经此端口主动下发;
# 与数据面 (50051) 分端口部署, 仅内网/本机可达, 不对客户端开放.
# secret 须与 GameServer config.yaml 的 vhserver.admin_secret 一致, 为空则控制面整体关闭
admin:
  host: "127.0.0.1"
  port: 50053
  # 生产环境优先用环境变量 ADMIN_SECRET 注入并删除此行
  secret: "dev-admin-secret-2026"

ai_brain:
  llm_api_base_url: "https://api.deepseek.com"
  llm_api_key: "sk-xxx"
  llm_model_name: "deepseek-chat"
  tts_model_path: "../models/zh_CN-huayan-medium.onnx"
  v2f_model_path: "../models/v2f_audio2face.onnx"
  intra_op_threads: 1
  v2f_use_gpu: false
  # 单次回复生成上限。NPC 对话通常 1~3 句, 常规长度由 system_prompt 软约束控制;
  # 此值兜底极端失控场景, 长剧情独白(约 1500 字)也不会被硬截断。
  # 客户端 MaxQueueChunks=600 与之联动: 2048 tokens ≈ 800~1000 块(0.4s/块), 600 为最后防线
  max_generation_tokens: 2048
  llm_temperature: 0.7
  system_prompt: "你是一个专业的AI助手，请用简洁自然的语气回答用户的问题。"

nlp:
  host: "127.0.0.1"
  port: 50052
  max_retries: 3
  recv_timeout_sec: 15
  send_timeout_sec: 10

streaming:
  audio_sample_rate: 22050        # Piper TTS 输出采样率，直接下发客户端播放
  v2f_input_sample_rate: 22050    # Audio2Face 推理输入采样率（当前自训练模型硬编码 22050Hz / 30FPS = 735 样本/帧，须与 audio_sample_rate 一致；若切换 NVIDIA 官方 A2F 微服务改为 16000 即可自动重采样对齐）
  animation_fps: 30
  sub_chunk_samples: 8820

logging:
  level: "info"
  file_path: "logs/vh_server.log"
  max_file_size_mb: 10
  max_files: 3
