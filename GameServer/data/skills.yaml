# 技能静态配置 (Phase 3 战斗): 服务器伤害计算的数据源
# 对应客户端攻击 GA (GA_FireBase / GA_MeleeAttackBase / GA_PlungeAttackBase);
# 客户端命中只上报 skill_id, 服务器按下表算伤害并裁决暴击

skills:
  - skill_id: 1
    name: "Melee Slash"
    damage_multiplier: 1.2     # 基础伤害 = 玩家攻击 * 此倍率
    crit_rate: 0.05            # 暴击率 (服务器裁决)
    crit_dmg: 0.5              # 暴击时伤害 *= (1 + 此值)
  - skill_id: 2
    name: "Ranged Shot"
    damage_multiplier: 0.8
    crit_rate: 0.15
    crit_dmg: 0.6
  - skill_id: 3
    name: "Plunge Strike"
    damage_multiplier: 2.0
    crit_rate: 0.08
    crit_dmg: 0.5
  - skill_id: 4
    name: "Revive Beam"
    damage_multiplier: 0.0     # 治疗/复活技能: 无伤害
    crit_rate: 0.0
    crit_dmg: 0.0